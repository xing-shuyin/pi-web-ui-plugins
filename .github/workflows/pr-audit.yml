name: Plugin PR Audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install --no-audit

      - name: Run Plugin Audit
        id: audit_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/audit.mjs

      - name: Post Audit Comment to PR
        uses: actions/github-script@v7
        if: always()
        continue-on-error: true
        with:
          script: |
            try {
              const fs = require('fs');
              const summaryFile = process.env.GITHUB_STEP_SUMMARY;
              if (!summaryFile || !fs.existsSync(summaryFile)) return;
              const body = fs.readFileSync(summaryFile, 'utf8');
              if (!body.trim()) return;

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const botComment = comments.find(c => 
                c.user.type === 'Bot' && c.body.includes('Plugin Audit Report')
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body,
                });
              }
            } catch (err) {
              console.warn(`⚠️ Unable to post comment to PR (likely read-only token from fork PR): ${err.message}`);
            }

      - name: Apply PR Labels
        uses: actions/github-script@v7
        if: always()
        continue-on-error: true
        with:
          script: |
            try {
              const passed = '${{ steps.audit_run.outputs.passed }}' === 'true';
              
              const labelsToAdd = [];
              if (passed) {
                labelsToAdd.push('auto-merge-ready');
              } else {
                labelsToAdd.push('audit-failed');
              }

              // 添加对应标签
              if (labelsToAdd.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: labelsToAdd,
                });
              }
            } catch (err) {
              console.warn(`⚠️ Unable to apply PR labels (likely read-only token from fork PR): ${err.message}`);
            }

      - name: Save PR info for auto-merge
        if: steps.audit_run.outputs.passed == 'true'
        run: |
          echo '{"prNumber": ${{ github.event.pull_request.number }}, "passed": true}' > pr-info.json

      - name: Upload PR info
        if: steps.audit_run.outputs.passed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr-info
          path: pr-info.json
          retention-days: 1

      - name: Immediate auto-merge attempt (for internal PRs)
        if: steps.audit_run.outputs.auto_merge == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve --body "🤖 Auto-approved by Plugin Audit CI" || true
          gh pr merge ${{ github.event.pull_request.number }} --squash --auto || true
