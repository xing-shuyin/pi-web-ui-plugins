name: Build and Publish Catalog

on:
  push:
    branches: [main]
  # GITHUB_TOKEN 的合并推送不会触发 push 事件，只能靠 workflow_run 兜住
  workflow_run:
    workflows: ["Auto-merge PR"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

# gh-pages 是同一个分支，并发部署会撞上 cannot lock ref
concurrency:
  group: build-and-publish-catalog
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install --no-audit

      - name: Build Catalog
        run: node scripts/build-catalog.mjs

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
