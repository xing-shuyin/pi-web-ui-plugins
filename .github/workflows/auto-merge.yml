name: Auto-merge PR

on:
  workflow_run:
    workflows: ["Plugin PR Audit"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_repository.owner.login }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download PR info
        uses: actions/download-artifact@v4
        with:
          name: pr-info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR_NUM=$(jq -r '.prNumber // empty' pr-info.json)
          if [ -z "$PR_NUM" ]; then
            echo "pr-info.json had no prNumber, resolving from open PRs for $HEAD_OWNER:$HEAD_BRANCH"
            PR_NUM=$(gh pr list --repo "$REPO" --state open \
              --head "$HEAD_OWNER:$HEAD_BRANCH" --json number --jq '.[0].number // empty')
          fi
          if [ -z "$PR_NUM" ]; then
            echo "::error::Could not resolve a PR for $HEAD_OWNER:$HEAD_BRANCH (audit run $RUN_ID)."
            exit 1
          fi
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "🚀 Resolved PR #$PR_NUM in $REPO"

      - name: Approve and merge
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
        run: |
          STATE=$(gh pr view "$PR_NUM" --repo "$REPO" --json state --jq .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR_NUM is $STATE — nothing to merge."
            exit 0
          fi

          # 标签缺失时 add-label 会直接报错，先幂等创建
          gh label create "auto-merge-ready" --repo "$REPO" --force \
            --color 0e8a16 --description "Plugin audit passed; safe to auto-merge"
          gh pr edit "$PR_NUM" --repo "$REPO" --add-label "auto-merge-ready"

          gh pr review "$PR_NUM" --repo "$REPO" --approve \
            --body "🤖 Auto-approved by Plugin Audit CI (all checks passed)"

          gh pr merge "$PR_NUM" --repo "$REPO" --squash

          OID=$(gh pr view "$PR_NUM" --repo "$REPO" --json mergeCommit --jq '.mergeCommit.oid // empty')
          echo "merge_oid=$OID" >> "$GITHUB_OUTPUT"
          echo "✅ Merged as $OID"

      # GITHUB_TOKEN 推送不会触发 push 事件，catalog 必须显式重建
      - name: Trigger catalog rebuild
        if: steps.merge.outputs.merge_oid != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MERGE_OID: ${{ steps.merge.outputs.merge_oid }}
        run: |
          HEAD_SHA=""
          for _ in $(seq 1 10); do
            HEAD_SHA=$(gh api "repos/$REPO/commits/main" --jq .sha)
            [ "$HEAD_SHA" = "$MERGE_OID" ] && break
            sleep 3
          done
          if [ "$HEAD_SHA" != "$MERGE_OID" ]; then
            echo "::warning::main head is $HEAD_SHA, expected $MERGE_OID — rebuilding anyway"
          fi
          gh workflow run build-catalog.yml --repo "$REPO" --ref main
